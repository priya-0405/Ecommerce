<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/login.css" type="text/css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet" />
    <title>Login Page</title>
</head>
<body>
    <main>
        <!-- header-section -->
    <header>
      <div class=" container header">
        <div class="header-logo">
          <img src="/assets/icons/ecom.svg" alt="">
          <div class="menu">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
              stroke="currentColor" class="size-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
          </div>
          <div class="search-box">
            <input type="text" name="text" placeholder="search">
            <div class="box">
              <img src="/assets/icons/Group 9.svg" alt="">
              <div class="search">|</div>
            </div>
          </div>
          <div class="header-link">
            <a href="/pages/home.html">Home</a>
            <a href="/pages/listing.html">Products</a>
            <a href="">About Us</a>
            <a href="">Contact Us</a>
          </div>
        </div>
        <div class="selection">
          <div class="ellipse">
            <img src="/assets/icons/Ellipse.svg" alt="" />
          </div>
          <img src="/assets/icons/Frame.svg" alt="">
          <div class="header-login">
            <img src="/assets/icons/icon.svg" alt="">
            <a href="/pages/login.html">Login</a>
            <div class="slash">/</div>
            <a href="/pages/register.html">Register</a>
          </div>
        </div>
      </div>
    </header>

    <!-- sign in -->
     <div class="sign-in">
        <h2>Sign in to your account</h2>
        <div class="login">
           <div class="account">
            <div class="mail">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email">
            </div>
            <div class="mail">
                <label for="password">Password</label>
                <input type="text" name="password" id="password" placeholder="***********">
            </div>
            <div class="check">
                <div class="box-check">
                    <input type="checkbox" id="checkbox">
                    <label for="checkbox">Remember me</label>
                </div>
                <div class="password">Forgot password</div>
            </div>
            <a href="/pages/register.html">
               <div class="sign-btn">
               <button type="submit">Sign in</button>
            </div>
            </a>
            <div class="continue">or continue with</div>
            <div class="google-ac">
                <button>Sign In  with Google</button>
                <img src="/assets/icons/google.svg" alt="google">
            </div>
            <div class="register">Don’t Have An Account Yet? <a href="">Register</a></div>
        </div>
        </div>
     </div>

     <!-- footer -->
    <div class="footer">
      <div class="container">
        <div class="footer-section">
          <h2>LOGO</h2>
          <div class="links">
            <a href="/pages/home.html">Home</a>
            <a href="">Contact Us</a>
            <a href="">Privacy Policy</a>
            <a href="">Terms & Conditions</a>
          </div>
        </div>
        <div class="Reserved">
          <div class="media">
            <a href="#">
              <img src="/assets/icons/facebook (1).svg" alt="" />
            </a>  
            <a href="#">
              <img src="/assets/icons/instagram (1).svg" alt="" />
            </a>
            <a href="#">
              <img src="/assets/icons/twitter (1).svg" alt="" />
            </a>
          </div>
          <div class="right">@All Right Reserved</div>
        </div>
      </div>
    </div>

    <!-- mobile-section -->
    <div class="mobile-icons">
      <a href="/pages/home.html">
        <div class="profile">
          <img src="/assets/icons/home.svg" alt="">
          <div>Home</div>
        </div>
      </a>
      <div class="profile">
        <img src="/assets/icons/search.svg" alt="">
        <div>Search</div>
      </div>
      <div class="profile">
        <img src="/assets/icons/products.svg" alt="">
        <div>Products</div>
      </div>
      <div class="profile">
        <img src="/assets/icons/icon.svg" alt="">
        <div>Profile</div>
      </div>
    </div>
    </main>
</body>
</html>
